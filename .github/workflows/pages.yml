# Tests, builds the static site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions". (Not yet run; first run may need small fixes.)
name: Deploy web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Fetch Pyodide core
        run: |
          curl -L -o core.tar.bz2 https://github.com/pyodide/pyodide/releases/download/0.27.7/pyodide-core-0.27.7.tar.bz2
          tar xjf core.tar.bz2 && mv pyodide pyodide_core
      - name: Build site
        run: python build_web.py
      - name: Custom domain
        run: echo "checker.tucker-marine.com" > web/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
